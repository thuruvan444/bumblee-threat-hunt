---
# ansible/attack_day2.yml
# Day 2 - VulnRecon on YAMCHA-PC

- name: "Day 2 - YAMCHA-PC: VulnRecon"
  hosts: YAMCHA-PC
  vars:
    ps1_dir: "{{ playbook_dir }}/../payloads/ps1"

  tasks:

    - name: "CLEANUP - delete old VulnRecon"
      ansible.windows.win_file:
        path: "{{ item }}"
        state: absent
      loop:
        - C:\ProgramData\VulnRecon.ps1
        - C:\ProgramData\vulnrecon_out.txt
      ignore_errors: yes

    - name: Drop vulnrecon_sim.ps1
      ansible.windows.win_copy:
        src: "{{ ps1_dir }}/vulnrecon_sim.ps1"
        dest: C:\ProgramData\VulnRecon.ps1

    - name: "VULNRECON - -v flag (Sysmon Event 1)"
      ansible.windows.win_shell: |
        powershell.exe -ExecutionPolicy Bypass -File C:\ProgramData\VulnRecon.ps1 -v
      ignore_errors: yes

    - name: "VULNRECON - -o flag"
      ansible.windows.win_shell: |
        powershell.exe -ExecutionPolicy Bypass -File C:\ProgramData\VulnRecon.ps1 -o
      ignore_errors: yes